<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>財富流沙盤 - 多人聯機版 | 順流·平流·逆流</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --color-primary: #0099cc;
            --color-accent: #00ccff;
            --color-success: #4caf50;
            --color-warning: #ff9800;
            --color-danger: #ff6b6b;
        }

        body {
            background: linear-gradient(145deg, #003d4d 0%, #007799 100%);
            font-family: 'Segoe UI', 'Noto Sans TC', system-ui, sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .top-audio-bar {
            width: 100%;
            background: rgba(10, 42, 56, 0.95);
            border-radius: 50px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            border: 1px solid #ffb347;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .audio-label {
            color: #ffd966;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-player-compact {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .music-status {
            font-size: 12px;
            color: #ffefc0;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .network-status {
            font-size: 12px;
            color: #ffefc0;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .network-status.connected {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.2);
        }

        .game-main-row {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        .game-panel {
            flex: 2;
            min-width: 900px;
            min-height: 900px;
            background: #0a2a38;
            border-radius: 60px;
            padding: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,200,0.2);
            border: 1px solid #ffb347;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
        }

        .three-tier-board {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fef5e0 0%, #ffefc8 100%);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,245,180,0.9);
            overflow: visible;
            border-radius: 0;
            border: 4px solid #2e7d32;
        }

        .flow-square-border {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96%;
            height: 96%;
            border: 4px solid #2e7d32;
            z-index: 0;
            pointer-events: none;
            background: rgba(226,240,232,0.15);
            border-radius: 0;
            box-shadow: inset 0 0 10px rgba(46,125,50,0.2);
        }

        .streamline-circle-border {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 84%;
            height: 84%;
            border: 4px solid #ff9800;
            z-index: 1;
            pointer-events: none;
            background: rgba(255,244,224,0.2);
            border-radius: 50%;
            box-shadow: inset 0 0 8px rgba(255,152,0,0.2);
        }

        .reverse-ring {
            position: absolute;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, #ffdede, #ffb7b7);
            border: 3px solid #b71c1c;
            z-index: 1;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 0 1px rgba(255,215,0,0.3);
        }

        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #ffb347, #ff8c00);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 18px rgba(0,0,0,0.5), 0 0 0 5px #ffec80;
            border: 2px solid #ffd966;
            z-index: 60;
            text-shadow: 1px 1px 0 #a35c00;
        }

        .center-hub-text {
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 30px;
            margin-top: 4px;
        }

        .cells-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .cell {
            position: absolute;
            width: 56px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            text-align: center;
            border: 1.5px solid #2c2c2c;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            cursor: pointer;
            background: rgba(255,250,210,0.98);
            backdrop-filter: blur(1px);
            pointer-events: auto;
        }

        .cell:hover { transform: scale(1.05); z-index: 99; }

        .cell.type-start { background: linear-gradient(135deg, #2c3e50, #1a2632); color: white; }
        .cell.type-income { background: linear-gradient(135deg, #ff9800, #ffc107); color: #333; }
        .cell.type-expense { background: linear-gradient(135deg, #dc143c, #ff6b6b); color: white; }
        .cell.type-market { background: linear-gradient(135deg, #00acc1, #26c6da); color: white; }
        .cell.type-awareness {background: linear-gradient(135deg, #ff9800, #e65100);color: white;animation: awarenessGlow 2s infinite;}
        .cell.type-event { background: linear-gradient(135deg, #ffeb3b, #fdd835); color: #333; }
        .cell.type-settlement { background: linear-gradient(135deg, #ffb300, #ff8f00); color: white; }
        .cell.type-grace { background: linear-gradient(135deg, #ffd966, #ffb74d); color: #333; }
        .cell.type-opportunity { background: linear-gradient(135deg, #aa00ff, #e040fb); color: white; }
        .cell.type-lucky_star { background: linear-gradient(135deg, #ff9800, #ffc107); color: #333; animation: starGlow 1.5s infinite; }
        .cell.type-four_leaf_clover { background: linear-gradient(135deg, #4caf50, #8bc34a); color: white; animation: cloverGlow 1.5s infinite; }
        .cell.type-reversal { background: linear-gradient(135deg, #bf360c, #e64a19); color: white; }
        .cell.type-miracle { background: linear-gradient(135deg, #ff4081, #f50057); animation: glowSoft 1.5s infinite; }
        .cell.type-hardship { background: linear-gradient(135deg, #7f0000, #d32f2f); color: white; }
        .cell.type-unemployment { background: linear-gradient(135deg, #4a148c, #7b1fa2); color: white; }
        .cell.type-bankruptcy { background: linear-gradient(135deg, #1b1b3a, #2c2c6e); color: white; }
        .cell.type-recovery { background: linear-gradient(135deg, #00b09b, #96c93d); color: #222; }
        .cell.type-investment { background: linear-gradient(135deg, #1565c0, #42a5f5); color: white; }
        .cell.type-dream { background: linear-gradient(135deg, #8e24aa, #ce93d8); color: white; animation: dreamGlow 2s infinite; }
        .cell.type-audit { background: linear-gradient(135deg, #e65100, #ff6d00); color: white; }
        .cell.type-flowbankruptcy { background: linear-gradient(135deg, #b71c1c, #f44336); color: white; }
        .cell.type-lier { background: linear-gradient(135deg, #dc143c, #ff6b6b); color: white; animation: lierGlow 1s infinite;}
        .cell.type-police { background: linear-gradient(135deg, #2e7d32, #4caf50); color: white; animation: policeGlow 1.5s infinite;}
        .cell.type-volunteer {background: linear-gradient(135deg, #4caf50, #2e7d32);color: white;animation: volunteerGlow 2s infinite;}
        .cell.type-hardship {background: linear-gradient(135deg, #dc143c, #8b0000);color: white;animation: hardshipGlow 1.5s infinite;}
        .cell.type-business_failure {background: linear-gradient(135deg, #ff6b6b, #c0392b);color: white;}
        .cell.type-unemployment {background: linear-gradient(135deg, #7f8c8d, #2c3e50);color: white;}
        .cell.type-reverse_entry {background: linear-gradient(135deg, #7b1fa2, #4a148c);color: white;animation: reverseGlow 1.5s infinite;}
        .cell.type-reverse_exit {background: linear-gradient(135deg, #2e7d32, #1b5e20);color: white;animation: reverseGlow 1.5s infinite;}

@keyframes reverseGlow {
    0%, 100% { filter: brightness(1); box-shadow: 0 0 5px #7b1fa2; }
    50% { filter: brightness(1.2); box-shadow: 0 0 15px #9c27b0; }
}

        @keyframes starGlow { 0%,100%{ filter: brightness(1); } 50%{ filter: brightness(1.2); box-shadow: 0 0 10px #ff9800; } }
        @keyframes cloverGlow { 0%,100%{ filter: brightness(1); } 50%{ filter: brightness(1.2); box-shadow: 0 0 10px #4caf50; } }
        @keyframes glowSoft { 0%,100%{ filter: brightness(1); } 50%{ filter: brightness(1.2); box-shadow: 0 0 10px #ff80ab; } }
        @keyframes dreamGlow { 0%,100%{ box-shadow: 0 0 0 0 rgba(206,147,216,0.8);} 50%{ box-shadow: 0 0 0 4px rgba(206,147,216,0.5);} }
        @keyframes lierGlow {0%, 100% { filter: brightness(1); box-shadow: 0 0 5px #dc143c; }50% { filter: brightness(1.2); box-shadow: 0 0 15px #ff0000; }}
        @keyframes policeGlow {0%, 100% { filter: brightness(1); box-shadow: 0 0 5px #4caf50; }50% { filter: brightness(1.15); box-shadow: 0 0 12px #4caf50; }}
        @keyframes volunteerGlow {0%, 100% { filter: brightness(1); box-shadow: 0 0 5px #4caf50; }50% { filter: brightness(1.15); box-shadow: 0 0 15px #4caf50; }}
        @keyframes awarenessGlow {0%, 100% { filter: brightness(1); box-shadow: 0 0 5px #ff9800; }50% { filter: brightness(1.15); box-shadow: 0 0 15px #ff9800; }}
        @keyframes hardshipGlow {0%, 100% { filter: brightness(1); box-shadow: 0 0 5px #dc143c; }50% { filter: brightness(1.2); box-shadow: 0 0 15px #dc143c; }}

        .cell.highlight {
            box-shadow: 0 0 0 3px #ffff88, 0 0 0 6px #ff9800, 0 4px 12px black;
            transform: scale(1.1);
            z-index: 200;
        }

        /* ✅ Token overlay - sits on top of all cell layers */
        #tokenOverlay {
            z-index: 500;
            pointer-events: none;
        }

        /* ✅ Player tokens - positioned absolutely in the overlay */
        .player-token {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
            /* Smooth movement between cells */
            transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
            left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-token img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sidebar {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: rgba(28, 28, 32, 0.96);
            color: #ffefc0;
            border-radius: 28px;
            padding: 16px 18px;
            border: 1px solid #ffb347;
            backdrop-filter: blur(4px);
            max-height: 420px;
            overflow-y: auto;
        }

        .panel-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
            color: #ffd966;
            border-left: 4px solid #ffb347;
            padding-left: 12px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 7px 0;
        }

        .control-panel {
            background: linear-gradient(135deg, #1a472a, #1b5e3f);
            border: 2px solid #ffd966;
        }

        button {
            background: #ffb347;
            border: none;
            font-weight: bold;
            font-size: 14px;
            padding: 9px;
            border-radius: 50px;
            margin: 6px 0;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: 0.1s;
            width: 100%;
        }

        button:hover:not(:disabled) { background: #ffc107; transform: scale(1.01); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-clover { background: #4caf50; }
        .btn-clover:hover:not(:disabled) { background: #66bb6a; }
        .btn-star { background: #ff9800; }
        .btn-star:hover:not(:disabled) { background: #ffb74d; }
        .btn-repay { background: #4caf50; }

        .log-panel {
            font-family: monospace;
            font-size: 10px;
            background: #1e1e1e;
            max-height: 300px;
        }

        .log-entry {
            padding: 5px;
            border-bottom: 1px solid #555;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .modal-body {
            font-size: 14px;
            margin-bottom: 16px;
            white-space: pre-wrap;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-primary, .btn-secondary {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary { background: #ffb347; color: #333; }
        .btn-primary:hover { background: #ffc107; }
        .btn-secondary { background: #ccc; color: #333; }
        .btn-secondary:hover { background: #ddd; }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .player-item {
            background: rgba(255, 179, 71, 0.2);
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            border-left: 3px solid #ffb347;
        }

        @media (max-width: 1000px) {
            .game-panel { min-width: 580px; min-height: 580px; padding: 20px; }
            .board-wrapper { max-width: 520px; }
            .cell { width: 48px; height: 48px; }
            .center-hub { width: 70px; height: 70px; font-size: 30px; }
            .top-audio-bar { flex-direction: column; align-items: stretch; }
        }

        @media (max-width: 800px) {
            .game-panel { min-width: 460px; min-height: 460px; }
            .board-wrapper { max-width: 420px; }
            .cell { width: 42px; height: 42px; }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin: 6px 0;
        }
        .button-group button {
            flex: 1;
            margin: 0;
        }
        /* 骗子卡模态框动画 */
        #lierCardModal .modal-content {
            animation: slideIn 0.3s ease;
        }

        #lierCardModal .modal-content {
            border: 2px solid #ff6b6b;
            box-shadow: 0 0 20px rgba(255,107,107,0.3);
        }

        #lierCardImg {
            transition: transform 0.3s ease;
        }

        #lierCardImg:hover {
            transform: scale(1.02);
        }

        .turn-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a472a, #2e7d32);
            padding: 10px 24px;
            border-radius: 30px;
            border: 2px solid #ffd966;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 150;
            min-width: 300px;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .turn-indicator.my-turn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border-color: #fff59d;
            animation: turnPulse 1.5s ease infinite;
            box-shadow: 0 6px 24px rgba(255,152,0,0.5);
        }

        @keyframes turnPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.02); }
        }

        .turn-indicator-label {
            font-size: 13px;
            color: #ffd966;
            font-weight: bold;
        }

        .turn-indicator.my-turn .turn-indicator-label {
            color: #fff59d;
        }

        .turn-indicator-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .turn-indicator-status {
            font-size: 11px;
            color: #b3e5fc;
            background: rgba(0,0,0,0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .turn-indicator.my-turn .turn-indicator-status {
            color: #fff9c4;
            background: rgba(0,0,0,0.4);
        }

        .turn-indicator-roll-btn {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: 2px solid #a5d6a7;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(76,175,80,0.5);
            transition: all 0.2s ease;
            white-space: nowrap;
            animation: rollBtnGlow 1.5s ease infinite;
            width: auto;
            margin: 0;
        }

        .turn-indicator-roll-btn:hover:not(:disabled) {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(76,175,80,0.7);
            background: linear-gradient(135deg, #66bb6a, #388e3c);
        }

        .turn-indicator-roll-btn:disabled {
            background: linear-gradient(135deg, #9e9e9e, #616161);
            border-color: #bdbdbd;
            cursor: not-allowed;
            animation: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            opacity: 0.6;
        }

        @keyframes rollBtnGlow {
            0%, 100% {
                box-shadow: 0 4px 14px rgba(76,175,80,0.5);
            }
            50% {
                box-shadow: 0 4px 20px rgba(76,175,80,0.9),
                0 0 0 4px rgba(76,175,80,0.2);
            }
        }

    </style>
</head>
<body>
<div class="container">
    <div class="top-audio-bar">
        <div class="audio-label">🎵 背景音樂</div>
        <audio id="bgAudio" class="audio-player-compact" controls loop preload="auto">
            <source src="../frontend/财富流音樂90分鐘.mp3" type="audio/mpeg">
        </audio>
        <div class="music-status" id="musicStatus">🎧 播放中</div>
        <div class="network-status" id="networkStatus">⚪ 未連接</div>
        <input type="text" id="playerName" placeholder="輸入玩家名稱" maxlength="20" style="padding: 6px 12px; border-radius: 20px; border: none;">
        <button id="btnConnect" onclick="window.gameClient?.connect()" style="width: auto; padding: 6px 20px;">🔌 連接</button>
        <button id="btnRename"
                style="width: auto; padding: 6px 20px; background: #9c27b0; display: none;">
            📝 改名
        </button>
    </div>

    <div class="game-main-row">
        <div class="game-panel">
            <div class="turn-indicator" id="turnIndicator">
                <div class="turn-indicator-label">🎯 當前回合</div>
                <div class="turn-indicator-name" id="turnIndicatorName">等待玩家加入...</div>
                <div class="turn-indicator-status" id="turnIndicatorStatus"></div>
            </div>
            <button id="btnRollTop"
                    class="turn-indicator-roll-btn"
                    onclick="window.gameClient?.rollDice()"
                    style="display: none;">
                🎲 擲骰子
            </button>
            <div class="board-wrapper">
                <div class="three-tier-board" id="threeTierBoard">
                    <div class="flow-square-border"></div>
                    <div class="streamline-circle-border"></div>
                    <div class="reverse-ring"></div>
                    <div class="center-hub" id="centerHub">
                        <div>💰</div>
                        <div class="center-hub-text" id="layerText">財富流</div>
                    </div>
                    <div class="cells-layer" id="reverseCellsLayer"></div>
                    <div class="cells-layer" id="streamlineCellsLayer"></div>
                    <div class="cells-layer" id="flowCellsLayer"></div>
                    <div class="cells-layer" id="tokenOverlay"></div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">💰 財務報表</div>
                <div class="panel-row"><span>現金</span><strong id="statCash">10000</strong></div>
                <div class="panel-row"><span>月薪</span><strong id="statSalary">5000</strong></div>
                <div class="panel-row"><span>副業</span><strong id="statSideIncome">0</strong></div>
                <div class="panel-row"><span>被動收入</span><strong id="statPassiveIncome">0</strong></div>
                <div class="panel-row"><span>📊 月現金流</span><strong id="statMonthlyCF">+5000</strong></div>
                <div class="panel-row"><span>生活支出</span><strong id="statLiving">4000</strong></div>
                <div class="panel-row"><span>稅金</span><strong id="statTax">500</strong></div>
                <div class="panel-row"><span>貸款利息</span><strong id="statLoanInterest">0</strong></div>
                <div class="panel-row"><span>💰 本利和</span><strong id="statTotalLoanRepay" style="color:#4caf50;">0</strong></div>
                <div class="panel-row"><span>💸 待償還債務</span><strong id="statPendingDebt" style="color:#ff9800;">0</strong></div>
                <div class="panel-row"><span>總支出</span><strong id="statTotalExpense">4500</strong></div>
            </div>

            <div class="panel">
                <div class="panel-title">⚡ 狀態</div>
                <div class="panel-row"><span>精力</span><strong id="statEnergy">10</strong>/10</div>
                <div class="panel-row"><span>幸運值</span><strong id="statLuck">5.0</strong>/10</div>
                <div class="panel-row"><span>⭐ 幸運星</span><strong id="statLuckyStar">0</strong></div>
                <div class="panel-row"><span>🍀 四葉草</span><strong id="statFourLeafClover">0</strong></div>
                <div class="panel-row"><span>🛡️ 逆境卡抵擋</span><strong id="statHardshipShield">0</strong></div>
                <div class="panel-row"><span>👮 義工服務</span><strong id="statVolunteerProgress" style="font-weight: bold;">0/5</strong></div>
                <div class="panel-row"><span>🤝 社會貢獻</span><strong id="statContributionProgress" style="font-weight: bold;">0/1</strong></div>
                <div class="panel-row"><span>層級</span><strong id="statLayer">平流層</strong></div>
            </div>

            <div class="panel">
                <div class="panel-title">👥 在線玩家</div>
                <div class="players-list" id="playersList">
                    <div style="color: #999; font-size: 12px;">未連接</div>
                </div>
            </div>

            <div class="panel control-panel" id="controlPanel">
                <div class="panel-title">🎮 控制面板</div>
                <button id="btnRoll" onclick="window.gameClient?.rollDice()" disabled>🎲 擲骰子</button>
                <div class="button-group">
                    <button id="btnUseClover" onclick="window.gameClient?.useFourLeafClover()" disabled class="btn-clover">🍀 四葉草 (x2)</button>
                    <button id="btnUseLuckyStar" onclick="window.gameClient?.useLuckyStar()" disabled class="btn-star">⭐ 幸運星 (x3)</button>
                </div>
                <button id="btnEndTurn" onclick="window.gameClient?.endTurn()" disabled>⏭️ 結束回合</button>
                <button id="btnLoan" onclick="window.gameClient?.applyLoan()" disabled>🏦 申請貸款 (10%利息)</button>
                <button id="btnRepayLoan" onclick="window.gameClient?.repayLoan()" class="btn-repay" disabled>💰 償還貸款</button>
                <button id="btnProperty" onclick="window.gameClient?.showPropertyPanel()" style="background: #9c27b0;">🏠 物業管理</button>
                <button id="btnPortfolio" onclick="window.gameClient?.showPortfolio()"
                        style="background: #2196f3;">
                    📊 投資組合
                </button>
                <button id="btnLending" onclick="window.gameClient?.showLendingPanel()"
                        style="background: #f57c00;">
                    💸 借還款
                </button>
                <button id="btnDisconnect" onclick="window.gameClient?.disconnect()">🔌 斷開連接</button>
            </div>

            <div class="panel log-panel">
                <div class="panel-title">📋 遊戲日誌</div>
                <div id="logContainer"></div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
