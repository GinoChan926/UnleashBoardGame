<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易記錄 - 財富流沙盤</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(145deg, #003d4d 0%, #007799 100%);
            font-family: 'Segoe UI', 'Noto Sans TC', system-ui, sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        h1 {
            color: #ffd966;
            margin: 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .stats-panel {
            background: rgba(28, 28, 32, 0.95);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            border: 1px solid #ffb347;
        }
        
        .stat-item {
            color: #ffefc0;
            font-size: 14px;
        }
        
        .stat-value {
            font-weight: bold;
            color: #ffb347;
            font-size: 18px;
            margin-left: 8px;
        }
        
        .filter-bar {
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            background: rgba(255, 179, 71, 0.3);
            border: 1px solid #ffb347;
            color: #ffefc0;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: #ffb347;
            color: #333;
        }
        
        .search-input {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 8px 15px;
            border-radius: 30px;
            width: 200px;
            font-size: 14px;
        }
        
        .refresh-btn {
            background: #4caf50;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .records-table {
            background: rgba(28, 28, 32, 0.95);
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid #ffb347;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            color: #ffefc0;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 179, 71, 0.3);
        }
        
        th {
            background: rgba(0,0,0,0.5);
            color: #ffd966;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background: rgba(255, 179, 71, 0.1);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-volunteer {background: #4caf72;color: white;}
        .badge-part_time { background: #ff9191; color: white; }
        .badge-finance { background: #2196f3; color: white; }
        .badge-business { background: #ff9800; color: white; }
        .badge-property { background: #9c27b0; color: white; }
        .badge-lier { background: #dc143c; color: white; }
        .badge-police { background: #2196f3; color: white; }
        .badge-general { background: #666; color: white; }
        .badge-market_news { background: #2196f3; color: white; }
        .badge-tip { background: #9c27b0; color: white; }
     
        .amount-positive { color: #4caf50; }
        .amount-negative { color: #ff6b6b; }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .back-btn {
            background: #ffb347;
            border: none;
            color: #333;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-btn:hover {
            background: #ffc107;
        }
        
        @media (max-width: 768px) {
            th, td {
                padding: 8px 10px;
                font-size: 12px;
            }
            .stats-panel {
                padding: 10px 15px;
            }
        }

        /* ── View toggle ─────────────────────────────────────────── */
        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .view-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid #ffb347;
            color: #ffefc0;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .view-btn:hover, .view-btn.active {
            background: #ffb347;
            color: #333;
        }

        /* ── Per-player analytics view ───────────────────────────── */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }

        .chart-card {
            background: rgba(28, 28, 32, 0.95);
            border-radius: 16px;
            border: 1px solid #ffb347;
            padding: 18px 20px;
        }
        .chart-card h3 {
            color: #ffd966;
            margin: 0 0 12px;
            font-size: 17px;
        }
        .chart-card svg { width: 100%; height: auto; display: block; }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
            font-size: 13px;
            color: #ffefc0;
        }
        .chart-legend .dot {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 3px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
        .player-card {
            background: rgba(28, 28, 32, 0.95);
            border-radius: 16px;
            border-top: 5px solid #ffb347;
            padding: 18px 20px;
        }
        .player-card h2 {
            margin: 0 0 12px;
            font-size: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pc-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .pc-metric {
            background: rgba(0,0,0,0.35);
            border-radius: 10px;
            padding: 8px 12px;
        }
        .pc-metric .label { font-size: 12px; color: #bdbdbd; }
        .pc-metric .value { font-size: 18px; font-weight: bold; }
        .pc-typebar {
            display: flex;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.08);
        }
        .pc-typebar span { height: 100%; }
        .pc-typelist { font-size: 12px; color: #ddd; line-height: 1.7; }
        .pc-typelist .k { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 交易記錄總覽</h1>
        <a href="index.html" class="back-btn">← 返回遊戲</a>
    </div>

    <div class="view-toggle">
        <button class="view-btn active" data-view="table">📋 全部記錄</button>
        <button class="view-btn" data-view="player">👥 分玩家分析</button>
    </div>

    <div id="tableView">
    <div class="stats-panel">
        <div class="stat-item">📋 總交易次數: <span class="stat-value" id="totalCount">0</span></div>
        <div class="stat-item">💰 總現金變化: <span class="stat-value" id="totalCashChange">0</span></div>
        <div class="stat-item">📈 總被動收入變化: <span class="stat-value" id="totalPassiveChange">0</span></div>
        <div class="stat-item">💪 總副業收入變化: <span class="stat-value" id="totalSideChange">0</span></div>
    </div>
    
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="part_time">💼 兼職</button>
        <button class="filter-btn" data-filter="finance">📈 財務</button>
        <button class="filter-btn" data-filter="business">🚀 創業</button>
        <button class="filter-btn" data-filter="property">🏠 地產</button>
        <button class="filter-btn" data-filter="lier">🎭 騙子卡</button>
        <button class="filter-btn" data-filter="police">👮 警察卡</button>
        <button class="filter-btn" data-filter="volunteer">🤝 義工卡</button>
        <button class="filter-btn" data-filter="market_news">📊 市場消息</button>
        <button class="filter-btn" data-filter="hardship">🎭 逆境自強</button>
        <button class="filter-btn" data-filter="tip">🎁 錦囊卡</button>
        <button class="filter-btn" data-filter="trust">🏦 資產信託</button>
        <button class="filter-btn" data-filter="investment">🏗️ 投資</button>
        <button class="filter-btn" data-filter="social">🤝 社會卡</button>
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋玩家或卡片...">
        <button class="refresh-btn" id="refreshBtn">🔄 刷新</button>
    </div>
    
    <div class="records-table">
        <table>
            <thead>
                <tr>
                    <th>時間</th>
                    <th>玩家</th>
                    <th>卡片類型</th>
                    <th>卡片名稱</th>
                    <th>操作</th>
                    <th>金額變化</th>
                    <th>被動收入變化</th>
                    <th>副業收入變化</th>
                    <th>詳細描述</th>
                </tr>
            </thead>
            <tbody id="recordsBody">
                <tr><td colspan="9" class="no-data">載入中...</td></tr>
            </tbody>
        </table>
    </div>
    </div><!-- /tableView -->

    <div id="playerView" style="display:none;">
        <div class="charts-row">
            <div class="chart-card">
                <h3>📈 各玩家累計現金變化</h3>
                <div id="lineChart"></div>
                <div class="chart-legend" id="lineLegend"></div>
            </div>
            <div class="chart-card">
                <h3>💰 各玩家淨現金變化</h3>
                <div id="barChart"></div>
            </div>
        </div>
        <div class="player-grid" id="playerGrid">
            <div class="no-data">暫無資料</div>
        </div>
    </div>
</div>

<script>
    // 獲取交易記錄
    async function fetchTransactions() {
        try {
            const response = await fetch('http://localhost:8080/api/transactions');
            if (response.ok) {
                const data = await response.json();
                return data;
            }
        } catch (e) {
            console.log('無法獲取交易記錄，使用本地存儲');
        }
        
        // 從 localStorage 獲取
        const saved = localStorage.getItem('wealthFlow_transactions');
        return saved ? JSON.parse(saved) : [];
    }
    
    // 渲染表格
    function renderTable(transactions, filter = 'all', search = '') {
    const tbody = document.getElementById('recordsBody');
    const filtered = transactions.filter(t => {
        if (filter !== 'all' && t.cardType !== filter) return false;
        if (search) {
            const q = search.toLowerCase();
            const inPlayer = (t.playerName || '').toLowerCase().includes(q);
            const inCard   = (t.cardName   || '').toLowerCase().includes(q);
            if (!inPlayer && !inCard) return false;
        }
        return true;
    });
    
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="no-data">暫無交易記錄</td></tr>';
        return;
    }
    
    let totalCash = 0;
    let totalPassive = 0;
    let totalSide = 0;
    
    tbody.innerHTML = filtered.map(t => {
        const amountClass = (t.amountChange || 0) >= 0 ? 'amount-positive' : 'amount-negative';
        const amountSymbol = (t.amountChange || 0) >= 0 ? '+' : '';
        
        totalCash += t.amountChange || 0;
        totalPassive += t.passiveIncomeChange || 0;
        totalSide += t.sideIncomeChange || 0;
        
        let badgeClass = '';
        let typeName = '';
        if (t.cardType === 'part_time') {
            badgeClass = 'badge-part_time';
            typeName = '💼 兼職';
        } else if (t.cardType === 'finance') {
            badgeClass = 'badge-finance';
            typeName = '📈 財務';
        } else if (t.cardType === 'business') {
            badgeClass = 'badge-business';
            typeName = '🚀 創業';
        } else if (t.cardType === 'property') {
            badgeClass = 'badge-property';
            typeName = '🏠 地產';
        } else if (t.cardType === 'lier') {
            badgeClass = 'badge-lier';
            typeName = '🎭 騙子卡';
        } else if (t.cardType === 'police') {
            badgeClass = 'badge-police';
            typeName = '👮 警察卡';
        } else if (t.cardType === 'volunteer') {  
            badgeClass = 'badge-volunteer';
            typeName = '🤝 義工卡';
        } else if (t.cardType === 'market_news') {
            badgeClass = 'badge-finance';
            typeName = '📊 市場消息';
        } else if (t.cardType === 'tip') {
            badgeClass = 'badge-business';
            typeName = '🎁 錦囊卡';
        } else if (t.cardType === 'hardship') {
            badgeClass = 'badge-lier';
            typeName = '🎭 逆境自強';
        } else if (t.cardType === 'trust') {
            badgeClass = 'badge-general';
            typeName = '🏦 資產信託';
        } else if (t.cardType === 'investment') {
            badgeClass = 'badge-business';
            typeName = '🏗️ 投資';
        }  else if (t.cardType === 'social') {
            badgeClass = 'badge-volunteer';
            typeName = '🤝 社會卡';
        }  else {
            badgeClass = 'badge-general';
            typeName = '🎁 察覺';
        }
        
        return `<tr>
            <td style="font-size: 11px;">${t.timestamp || '-'}</td>
            <td><strong>${escapeHtml(t.playerName || '-')}</strong></td>
            <td><span class="badge ${badgeClass}">${typeName}</span></td>
            <td>${escapeHtml(t.cardName || '-')}</td>
            <td>${t.action || '執行'}</td>
            <td class="${amountClass}">${amountSymbol}${(t.amountChange || 0).toLocaleString()} 元</td>
            <td class="${(t.passiveIncomeChange || 0) >= 0 ? 'amount-positive' : 'amount-negative'}">${(t.passiveIncomeChange || 0) >= 0 ? '+' : ''}${(t.passiveIncomeChange || 0).toLocaleString()}</td>
            <td class="${(t.sideIncomeChange || 0) >= 0 ? 'amount-positive' : 'amount-negative'}">${(t.sideIncomeChange || 0) >= 0 ? '+' : ''}${(t.sideIncomeChange || 0).toLocaleString()}</td>
            <td style="max-width: 250px; word-break: break-word;">${escapeHtml(t.details || '-')}</td>
        </tr>`;
    }).join('');
    
    document.getElementById('totalCount').innerText = filtered.length;
    document.getElementById('totalCashChange').innerHTML = totalCash >= 0 ? `+${totalCash.toLocaleString()}` : totalCash.toLocaleString();
    document.getElementById('totalCashChange').style.color = totalCash >= 0 ? '#4caf50' : '#ff6b6b';
    document.getElementById('totalPassiveChange').innerHTML = totalPassive >= 0 ? `+${totalPassive.toLocaleString()}` : totalPassive.toLocaleString();
    document.getElementById('totalSideChange').innerHTML = totalSide >= 0 ? `+${totalSide.toLocaleString()}` : totalSide.toLocaleString();
}
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── 卡片類型元資料（顏色 + 名稱），供圖表與玩家卡共用 ──────────────
    const TYPE_META = {
        part_time:   { name: '💼 兼職', color: '#ff9191' },
        finance:     { name: '📈 財務', color: '#2196f3' },
        business:    { name: '🚀 創業', color: '#ff9800' },
        property:    { name: '🏠 地產', color: '#9c27b0' },
        lier:        { name: '🎭 騙子', color: '#dc143c' },
        police:      { name: '👮 警察', color: '#03a9f4' },
        volunteer:   { name: '🤝 義工', color: '#4caf72' },
        market_news: { name: '📊 市場消息', color: '#00bcd4' },
        hardship:    { name: '🎭 逆境', color: '#e91e63' },
        tip:         { name: '🎁 錦囊', color: '#7e57c2' },
        trust:       { name: '🏦 信託', color: '#795548' },
        investment:  { name: '🏗️ 投資', color: '#8bc34a' },
        social:      { name: '🤝 社會', color: '#26a69a' },
        general:     { name: '🎁 察覺', color: '#888' }
    };
    function typeMeta(t) { return TYPE_META[t] || TYPE_META.general; }

    // 玩家固定配色（依出現順序）
    const PLAYER_COLORS = ['#ffd966','#4dd0e1','#ff8a65','#81c784','#ba68c8','#f06292','#a1887f','#90a4ae'];
    function playerColorMap(names) {
        const m = {};
        names.forEach((n, i) => { m[n] = PLAYER_COLORS[i % PLAYER_COLORS.length]; });
        return m;
    }

    // ── 依玩家彙總資料 ────────────────────────────────────────────────
    function aggregateByPlayer(txs) {
        // 交易以最新在前儲存 → 反轉為時間順序，方便計算累計值
        const chrono = txs.slice().reverse();
        const players = {};
        chrono.forEach(t => {
            const name = t.playerName || '(未知)';
            if (!players[name]) {
                players[name] = {
                    name, count: 0,
                    cash: 0, passive: 0, side: 0, salary: 0, energy: 0,
                    byType: {}, series: []
                };
            }
            const p = players[name];
            p.count++;
            p.cash    += t.amountChange || 0;
            p.passive += t.passiveIncomeChange || 0;
            p.side    += t.sideIncomeChange || 0;
            p.salary  += t.salaryChange || 0;
            p.energy  += t.energyChange || 0;
            p.byType[t.cardType] = (p.byType[t.cardType] || 0) + 1;
            p.series.push(p.cash); // 累計現金
        });
        return players;
    }

    const fmt = n => (n >= 0 ? '+' : '') + (n || 0).toLocaleString();
    const signClass = n => (n >= 0 ? 'amount-positive' : 'amount-negative');

    // ── 折線圖：各玩家累計現金 ────────────────────────────────────────
    function buildLineChart(players, colors) {
        const names = Object.keys(players);
        const W = 520, H = 260, padL = 56, padR = 16, padT = 16, padB = 28;
        const maxLen = Math.max(1, ...names.map(n => players[n].series.length));
        let lo = 0, hi = 0;
        names.forEach(n => players[n].series.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; }));
        if (hi === lo) hi = lo + 1;
        const x = i => padL + (maxLen <= 1 ? 0 : (i / (maxLen - 1)) * (W - padL - padR));
        const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);

        let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
        // 基線（0）與網格
        for (let g = 0; g <= 4; g++) {
            const gv = lo + (hi - lo) * g / 4;
            const gy = y(gv);
            svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="rgba(255,255,255,0.12)"/>`;
            svg += `<text x="${padL - 8}" y="${gy + 4}" fill="#bbb" font-size="11" text-anchor="end">${Math.round(gv).toLocaleString()}</text>`;
        }
        if (lo < 0 && hi > 0) {
            svg += `<line x1="${padL}" y1="${y(0)}" x2="${W - padR}" y2="${y(0)}" stroke="rgba(255,255,255,0.4)" stroke-dasharray="4 3"/>`;
        }
        names.forEach(n => {
            const s = players[n].series;
            if (!s.length) return;
            const pts = s.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
            svg += `<polyline points="${pts}" fill="none" stroke="${colors[n]}" stroke-width="2.5" stroke-linejoin="round"/>`;
            const li = s.length - 1;
            svg += `<circle cx="${x(li).toFixed(1)}" cy="${y(s[li]).toFixed(1)}" r="3.5" fill="${colors[n]}"/>`;
        });
        svg += `</svg>`;
        document.getElementById('lineChart').innerHTML = svg;
        document.getElementById('lineLegend').innerHTML = names
            .map(n => `<span><span class="dot" style="background:${colors[n]}"></span>${escapeHtml(n)}</span>`).join('');
    }

    // ── 長條圖：各玩家淨現金變化 ──────────────────────────────────────
    function buildBarChart(players, colors) {
        const names = Object.keys(players);
        const W = 520, rowH = 40, padL = 90, padR = 60, padT = 10;
        const H = padT * 2 + Math.max(1, names.length) * rowH;
        const maxAbs = Math.max(1, ...names.map(n => Math.abs(players[n].cash)));
        const zeroX = padL + (W - padL - padR) / 2;
        const halfW = (W - padL - padR) / 2;

        let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
        svg += `<line x1="${zeroX}" y1="${padT}" x2="${zeroX}" y2="${H - padT}" stroke="rgba(255,255,255,0.3)"/>`;
        names.forEach((n, i) => {
            const cy = padT + i * rowH + rowH / 2;
            const val = players[n].cash;
            const w = (Math.abs(val) / maxAbs) * halfW;
            const bx = val >= 0 ? zeroX : zeroX - w;
            const barColor = val >= 0 ? '#4caf50' : '#ff6b6b';
            svg += `<rect x="${bx.toFixed(1)}" y="${cy - 11}" width="${Math.max(1, w).toFixed(1)}" height="22" rx="4" fill="${barColor}"/>`;
            svg += `<text x="8" y="${cy + 4}" fill="${colors[n]}" font-size="13" font-weight="bold">${escapeHtml(n.length > 8 ? n.slice(0,8)+'…' : n)}</text>`;
            const tx = val >= 0 ? bx + w + 6 : bx - 6;
            const anchor = val >= 0 ? 'start' : 'end';
            svg += `<text x="${tx.toFixed(1)}" y="${cy + 4}" fill="#ffefc0" font-size="12" text-anchor="${anchor}">${fmt(val)}</text>`;
        });
        svg += `</svg>`;
        document.getElementById('barChart').innerHTML = svg;
    }

    // ── 每位玩家的詳情卡 ──────────────────────────────────────────────
    function buildPlayerCards(players, colors) {
        const names = Object.keys(players);
        const grid = document.getElementById('playerGrid');
        if (!names.length) { grid.innerHTML = '<div class="no-data">暫無資料</div>'; return; }

        grid.innerHTML = names.map(n => {
            const p = players[n];
            const typeEntries = Object.entries(p.byType).sort((a, b) => b[1] - a[1]);
            const total = p.count || 1;
            const bar = typeEntries.map(([t, c]) =>
                `<span style="width:${(c / total * 100).toFixed(1)}%;background:${typeMeta(t).color}" title="${escapeHtml(typeMeta(t).name)}: ${c}"></span>`
            ).join('');
            const list = typeEntries.map(([t, c]) =>
                `<span style="margin-right:12px;white-space:nowrap"><span class="k" style="background:${typeMeta(t).color}"></span>${escapeHtml(typeMeta(t).name)} ×${c}</span>`
            ).join('');
            return `<div class="player-card" style="border-top-color:${colors[n]}">
                <h2><span style="width:14px;height:14px;border-radius:4px;background:${colors[n]};display:inline-block"></span>${escapeHtml(n)}</h2>
                <div class="pc-metrics">
                    <div class="pc-metric"><div class="label">操作次數</div><div class="value" style="color:#ffd966">${p.count}</div></div>
                    <div class="pc-metric"><div class="label">淨現金變化</div><div class="value ${signClass(p.cash)}">${fmt(p.cash)}</div></div>
                    <div class="pc-metric"><div class="label">被動收入變化</div><div class="value ${signClass(p.passive)}">${fmt(p.passive)}</div></div>
                    <div class="pc-metric"><div class="label">副業收入變化</div><div class="value ${signClass(p.side)}">${fmt(p.side)}</div></div>
                    <div class="pc-metric"><div class="label">月薪變化</div><div class="value ${signClass(p.salary)}">${fmt(p.salary)}</div></div>
                    <div class="pc-metric"><div class="label">精力變化</div><div class="value ${signClass(p.energy)}">${fmt(p.energy)}</div></div>
                </div>
                <div class="pc-typebar">${bar}</div>
                <div class="pc-typelist">${list}</div>
            </div>`;
        }).join('');
    }

    function renderPlayerView(txs) {
        const players = aggregateByPlayer(txs || []);
        const names = Object.keys(players);
        const colors = playerColorMap(names);
        buildLineChart(players, colors);
        buildBarChart(players, colors);
        buildPlayerCards(players, colors);
    }

    // 初始化
    let currentFilter = 'all';
    let currentSearch = '';
    let transactions = [];
    
    async function loadData() {
        transactions = await fetchTransactions();
        renderTable(transactions, currentFilter, currentSearch);
        renderPlayerView(transactions);
    }

    // 視圖切換：全部記錄 <-> 分玩家分析
    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const view = btn.dataset.view;
            document.getElementById('tableView').style.display  = view === 'table'  ? '' : 'none';
            document.getElementById('playerView').style.display = view === 'player' ? '' : 'none';
        });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderTable(transactions, currentFilter, currentSearch);
    });
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderTable(transactions, currentFilter, currentSearch);
        });
    });
    
    loadData();
    
    // 每隔5秒自動刷新
    setInterval(loadData, 5000);
</script>
</body>
</html>
